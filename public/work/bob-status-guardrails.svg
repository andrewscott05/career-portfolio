<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#191713" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="300" fill="#FFFFFF" />

  <!-- main chain -->
  <!-- Box 0: BOOKED -->
  <rect x="15" y="40" width="140" height="60" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="85" y="76" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="15" fill="#191713">BOOKED</text>

  <!-- Box 1: DISPATCHED -->
  <rect x="181" y="40" width="140" height="60" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="251" y="76" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="13.5" fill="#191713">DISPATCHED</text>

  <!-- Box 2: AT PICKUP -->
  <rect x="347" y="40" width="140" height="60" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="417" y="76" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="14" fill="#191713">AT PICKUP</text>

  <!-- Box 3: IN TRANSIT -->
  <rect x="513" y="40" width="140" height="60" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="583" y="76" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="14" fill="#191713">IN TRANSIT</text>

  <!-- Box 4: AT DELIVERY -->
  <rect x="679" y="40" width="140" height="60" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="749" y="76" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="13.5" fill="#191713">AT DELIVERY</text>

  <!-- Box 5: DELIVERED -->
  <rect x="845" y="40" width="140" height="60" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="915" y="76" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="14" fill="#191713">DELIVERED</text>

  <!-- arrows between boxes -->
  <line x1="155" y1="70" x2="176" y2="70" stroke="#191713" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="321" y1="70" x2="342" y2="70" stroke="#191713" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="487" y1="70" x2="508" y2="70" stroke="#191713" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="653" y1="70" x2="674" y2="70" stroke="#191713" stroke-width="3" marker-end="url(#arrowhead)" />
  <line x1="819" y1="70" x2="840" y2="70" stroke="#191713" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- gate diamonds on every arrow -->
  <g fill="#2C5138" stroke="#191713" stroke-width="1.5">
    <rect x="163" y="63" width="10" height="10" transform="rotate(45 168 68)" />
    <rect x="329" y="63" width="10" height="10" transform="rotate(45 334 68)" />
    <rect x="495" y="63" width="10" height="10" transform="rotate(45 500 68)" />
    <rect x="661" y="63" width="10" height="10" transform="rotate(45 666 68)" />
    <rect x="827" y="63" width="10" height="10" transform="rotate(45 832 68)" />
  </g>

  <!-- illustrative disqualifier branch off the At Pickup -> In Transit gate -->
  <line x1="500" y1="75" x2="500" y2="160" stroke="#B07D3F" stroke-width="3" stroke-dasharray="6 6" />
  <text x="514" y="122" font-size="11.5" letter-spacing="0.06em" fill="#B07D3F">IF DISQUALIFIED</text>
  <text x="514" y="138" font-size="11.5" letter-spacing="0.06em" fill="#B07D3F">(OS&amp;D, MISSED WINDOW,</text>
  <text x="514" y="154" font-size="11.5" letter-spacing="0.06em" fill="#B07D3F">CONFLICTING INFO)</text>

  <rect x="390" y="170" width="220" height="52" fill="#FFFFFF" stroke="#B07D3F" stroke-width="3" />
  <text x="500" y="192" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="13" letter-spacing="0.02em" fill="#B07D3F">ESCALATE TO REP</text>
  <text x="500" y="209" text-anchor="middle" font-size="11" fill="#4A463C">status left unchanged</text>

  <!-- footnote -->
  <text x="15" y="264" font-size="12" letter-spacing="0.04em" fill="#A09A8C">THE SAME GATE SITS ON EVERY ARROW ABOVE, NOT JUST THIS ONE.</text>
</svg>
