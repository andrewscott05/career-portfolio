<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="af1" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#191713" />
    </marker>
    <marker id="af2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2C5138" />
    </marker>
    <marker id="af3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B07D3F" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="380" fill="#FFFFFF" />

  <!-- Box A: Load flagged -->
  <rect x="15" y="150" width="170" height="70" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="100" y="180" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#191713">LOAD FLAGGED</text>
  <text x="100" y="198" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#191713">FOR TRACKING</text>

  <!-- Box B: Bob Outreach SOP -->
  <rect x="225" y="150" width="160" height="70" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="305" y="180" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#191713">BOB OUTREACH</text>
  <text x="305" y="198" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#191713">SOP</text>

  <line x1="185" y1="185" x2="220" y2="185" stroke="#191713" stroke-width="3" marker-end="url(#af1)" />

  <!-- Channel boxes -->
  <rect x="450" y="55" width="110" height="55" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="505" y="88" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="13" fill="#191713">VOICE</text>

  <rect x="450" y="157" width="110" height="55" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="505" y="190" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="13" fill="#191713">TEXT</text>

  <rect x="450" y="259" width="110" height="55" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="505" y="292" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="13" fill="#191713">EMAIL</text>

  <!-- B to channels -->
  <line x1="386" y1="175" x2="446" y2="95" stroke="#191713" stroke-width="2.5" marker-end="url(#af1)" />
  <line x1="386" y1="185" x2="446" y2="185" stroke="#191713" stroke-width="2.5" marker-end="url(#af1)" />
  <line x1="386" y1="195" x2="446" y2="272" stroke="#191713" stroke-width="2.5" marker-end="url(#af1)" />

  <!-- channels to decision diamond -->
  <line x1="561" y1="85" x2="615" y2="170" stroke="#191713" stroke-width="2.5" marker-end="url(#af1)" />
  <line x1="561" y1="185" x2="605" y2="185" stroke="#191713" stroke-width="2.5" marker-end="url(#af1)" />
  <line x1="561" y1="285" x2="615" y2="200" stroke="#191713" stroke-width="2.5" marker-end="url(#af1)" />

  <!-- decision diamond -->
  <polygon points="655,140 700,185 655,230 610,185" fill="#FFFFFF" stroke="#191713" stroke-width="3" />
  <text x="655" y="181" text-anchor="middle" font-size="11" letter-spacing="0.04em" fill="#191713">ISSUE</text>
  <text x="655" y="196" text-anchor="middle" font-size="11" letter-spacing="0.04em" fill="#191713">FOUND?</text>

  <!-- NO branch: update logged -->
  <line x1="690" y1="150" x2="755" y2="105" stroke="#2C5138" stroke-width="3" marker-end="url(#af2)" />
  <text x="705" y="120" font-size="12" letter-spacing="0.06em" fill="#2C5138">NO</text>
  <rect x="760" y="70" width="225" height="65" fill="#FFFFFF" stroke="#2C5138" stroke-width="3" />
  <text x="872" y="98" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#2C5138">UPDATE LOGGED</text>
  <text x="872" y="116" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#2C5138">IN ARRIVENOW</text>

  <!-- YES branch: escalate -->
  <line x1="690" y1="220" x2="755" y2="262" stroke="#B07D3F" stroke-width="3" marker-end="url(#af3)" />
  <text x="700" y="255" font-size="12" letter-spacing="0.06em" fill="#B07D3F">YES</text>
  <rect x="760" y="245" width="225" height="65" fill="#FFFFFF" stroke="#B07D3F" stroke-width="3" />
  <text x="872" y="273" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#B07D3F">ESCALATE TO</text>
  <text x="872" y="291" text-anchor="middle" font-family="'Archivo Black', sans-serif" font-size="12.5" fill="#B07D3F">ARRIVE TEAM</text>

  <!-- footnote -->
  <text x="15" y="355" font-size="12" letter-spacing="0.04em" fill="#A09A8C">ONE SOP, THREE CHANNELS, ONE ESCALATION PATH WHEN SOMETHING NEEDS A REP.</text>
</svg>
